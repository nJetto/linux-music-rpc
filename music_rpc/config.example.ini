# ============================================================================
#  Linux Music RPC
#  https://github.com/nJetto/linux-music-rpc
#
#  Все параметры необязательны, кроме client_id.
#  Комментарии должны занимать отдельную строку (inline-комментарии не
#  поддерживаются).
# ============================================================================

[discord]
# Application ID вашего приложения Discord.
#
# 1. Откройте https://discord.com/developers/applications
# 2. New Application -> введите любое имя
# 3. Скопируйте "Application ID" и вставьте сюда.
#
# Бота создавать и токен получать НЕ нужно.
client_id =

# Необязательный путь к Unix-сокету Discord IPC. Оставьте пустым для
# автоматического поиска (Discord, Flatpak, Snap, Vesktop, arRPC).
# Пример: /run/user/1000/discord-ipc-0
ipc_path =

# Сколько секунд ждать перед повторной попыткой подключиться к Discord.
reconnect_interval = 10

[presence]
# Как часто проверять MPRIS-плееры (в секундах).
poll_interval = 1.0

# Показывать трек, когда он стоит на паузе.
show_paused = true

# Очищать статус Discord, когда музыка остановлена / плеер закрыт.
clear_when_stopped = true

# Очищать статус при выходе программы.
clear_on_exit = true

# Текст, который добавляется к строке исполнителя на паузе.
paused_text = ⏸ Пауза

# Что показывать, если в метаданных нет ни исполнителя, ни альбома.
fallback_state = Неизвестный исполнитель

# Шаблоны строк. Доступные поля:
#   {title} {artist} {album} {player} {status} {duration}
# Discord ограничивает каждую строку 128 символами.
details_format = {title}
state_format = {artist} — {album}

# Показывать прогресс трека (полосу времени в профиле Discord).
show_progress = true

# Подпись кнопки-ссылки на трек. Пустое значение отключает кнопку.
# Discord разрешает не более 32 символов.
button_label = Открыть трек

# Минимальный интервал между обновлениями статуса (в секундах).
# Слишком частые обновления Discord может ограничивать.
min_update_interval = 2.0

[players]
# Приоритет плееров, если одновременно играет несколько.
# Можно указывать точное имя или шаблон: spotify, chromium, firefox*.
# Пример: spotify, yandexmusic, chromium, firefox
priority_players =

# Плееры, которые нужно игнорировать. Поддерживаются шаблоны.
# Пример: mpv, vlc, firefox.instance_1_*
ignore_players =

[artwork]
# Загружать обложки треков.
enabled = true

# auto   — прямой URL из MPRIS, иначе поиск в iTunes;
# direct — только прямой URL из MPRIS;
# itunes — всегда искать обложку в iTunes;
# none   — не показывать обложки.
provider = auto

# Запасная картинка из Assets вашего Discord-приложения.
# Загрузите её в Developer Portal -> Rich Presence -> Art Assets
# и укажите её имя здесь. Например: music
fallback_image =

# Маленькие значки "играет"/"пауза" из Assets приложения.
# Оставьте пустыми, если не загружали их.
playing_image =
paused_image =

[logging]
# debug, info, warning или error.
level = info
